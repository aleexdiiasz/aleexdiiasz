name: Generate Snake

on:
  schedule:
    # Runs at 0 and 12 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Create or checkout output branch
          git checkout --orphan output 2>/dev/null || git checkout output
          
          # Remove all files and add only dist
          git rm -rf . --quiet 2>/dev/null || true
          git add dist/
          
          # Commit if there are changes
          git diff --cached --quiet || git commit -m "Generate snake animation"
          
          # Push to output branch
          git push origin output --force
