name: Generate Snake

on:
  schedule:
    # Corre a las 00:00 y 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Creamos la carpeta de salida manualmente
      - name: Create dist directory
        run: mkdir -p dist

      # Descargamos directamente el renderizado de la serpiente congelado en el año 2024
      - name: Generate 2024 Snake SVG
        run: |
          curl -s "https://github.io{{ github.repository_owner }}&year=2024" -o dist/github-contribution-grid-snake.svg
          curl -s "https://github.io{{ github.repository_owner }}&year=2024&palette=github-dark" -o dist/github-contribution-grid-snake-dark.svg

      - name: Push to output branch
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Ir a la rama de salida
          git checkout --orphan output 2>/dev/null || git checkout output
          
          # Limpiar archivos viejos y añadir las nuevas imágenes congeladas de 2024
          git rm -rf . --quiet 2>/dev/null || true
          git add dist/
          
          # Guardar y subir
          git diff --cached --quiet || git commit -m "Generate snake animation for year 2024"
          git push origin output --force
