name: Update profile art

# The banner, typing panel and stats card are static art: they only change when
# scripts/config.py changes. The contribution heatmap is the living part, so it
# is re-scraped and re-rendered once a day.
#
# If you already run a workflow in this repo (for example the snake), you can
# either keep this file as its own workflow or copy the contents of `jobs:` into
# the existing one as an extra job. Two workflows are fine: this one only ever
# commits the art files below.

on:
  schedule:
    - cron: "17 6 * * *"      # ~06:17 UTC daily, off-peak on purpose
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The render step only needs the repo, not its history.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install: every script uses the standard library only.
      - name: Fetch contribution data
        run: python scripts/fetch_stats.py

      - name: Render SVGs
        run: |
          python scripts/make_banner_svgs.py
          python scripts/make_typing_svg.py
          python scripts/make_stats_svg.py
          python scripts/make_heatmap_svg.py

      - name: Commit refreshed art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: >-
            data/stats.json
            header.svg
            footer.svg
            typing.svg
            stats.svg
            contrib-heatmap.svg
